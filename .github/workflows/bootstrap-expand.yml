name: Publish complete repository

on:
  push:
    paths:
      - '.bootstrap/GO'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct repository payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .bootstrap/chunk-00.b64 \
            .bootstrap/chunk-01.b64 \
            .bootstrap/tail-00.b64 \
            .bootstrap/tail-01.b64 \
            .bootstrap/tail-02.b64 \
            .bootstrap/tail-03.b64 \
            .bootstrap/tail-04.b64 \
            | tr -d '\n\r ' \
            | base64 --decode > /tmp/old-iron-ai-payload.tar.gz
          tar -tzf /tmp/old-iron-ai-payload.tar.gz >/dev/null
          tar -xzf /tmp/old-iron-ai-payload.tar.gz -C .
          rm -rf .bootstrap

      - name: Publish full tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish complete Old Iron AI repository'
          git push origin HEAD:main
